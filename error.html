<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title id="title">Kesalahan Hotspot - PPLG SMKN 1 Cirebon</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="shortcut icon" href="img/favicon.png" type="image/png">
  <link rel="icon" href="img/favicon.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
    }
    body, input, button, select, textarea, p, h1, h2, h3, h4, h5, h6, span, a, label {
      font-family: "Poppins", sans-serif;
    }
    *::selection {
      background-color: #6366f1;
      color: #fff;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Top Contact Bar -->
  <header class="relative w-full">
    <div class="bg-[#213555] py-2 px-4 sm:px-6 md:px-10 flex justify-between items-center text-xs">
      <div class="flex items-center gap-2 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
        <span>0231 480202</span>
      </div>
      <div class="flex gap-3 items-center">
        <img src="https://pplg-smkn1cirebon.sch.id/profil-pplg/public/icons8-facebook-144.png" alt="Facebook" class="w-4 h-4 object-contain" />
        <img src="https://pplg-smkn1cirebon.sch.id/profil-pplg/public/icons8-instagram-144.png" alt="Instagram" class="w-4 h-4 object-contain" />
        <img src="https://pplg-smkn1cirebon.sch.id/profil-pplg/public/icons8-twitter-144.png" alt="Twitter" class="w-4 h-4 object-contain" />
      </div>
    </div>
  </header>

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-[105] bg-white/95 backdrop-blur-md shadow-xs border-b border-slate-100">
    <nav class="flex justify-between items-center px-4 sm:px-6 md:px-10 py-3 max-w-7xl mx-auto">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <img
          src="img/logo.png"
          class="w-8 h-8 sm:w-10 sm:h-10 aspect-square object-contain"
          alt="SMKN 1 Cirebon"
        />
        <div class="leading-tight">
          <span class="font-bold text-slate-800 text-xs sm:text-sm md:text-base block">PPLG SMKN 1 CIREBON</span>
          <span class="text-[10px] sm:text-xs text-slate-500 block">Hotspot Error</span>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Error Card Section -->
  <main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8 text-center">
      
      <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>

      <h3 class="text-xl font-bold text-[#213555]">Terjadi Kesalahan</h3>
      <span class="block w-12 h-2 bg-indigo-500 mx-auto -mt-1 mb-3"></span>
      
      <div class="p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs sm:text-sm rounded-xl mb-6 text-left flex items-start gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>
          <span class="font-semibold block mb-0.5">Pesan Error:</span>
          <span>$(error)</span>
        </div>
      </div>

      <a
        href="$(link-login)"
        class="inline-flex items-center justify-center gap-2 w-full py-3 px-5 bg-[#213555] hover:bg-indigo-600 text-white font-semibold rounded-xl text-xs sm:text-sm uppercase tracking-wider transition duration-200 shadow-xs"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Kembali ke Halaman Login</span>
      </a>

      <div class="mt-5 pt-3 border-t border-slate-100 text-[11px] text-slate-400">
        <span>Jaringan Hotspot PPLG &bull; SMKN 1 Cirebon</span>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 bg-[#213555] px-4 sm:px-6 text-white w-full">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-center sm:text-left">
      <div class="flex items-center gap-2">
        <img src="img/logo.png" class="w-6 h-6 object-contain" alt="Logo" />
        <p class="font-semibold">SMK Negeri 1 Cirebon - PPLG</p>
      </div>
      <p class="text-slate-300 text-[11px]">Copyright &copy; 2026, SMKN 1 Cirebon.</p>
    </div>
  </footer>

  <script type="text/javascript">
    if (document.getElementById('title')) {
      document.getElementById('title').innerHTML = (window.location.hostname || "PPLG") + " > Kesalahan Hotspot";
    }
  </script>
</body>
</html>
